<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Skerry</title>
  <desc id="desc">A narrow golden opening in a midnight-blue rounded square</desc>
  <defs>
    <linearGradient id="bg" x1="24" y1="18" x2="232" y2="238" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111a2b"/>
      <stop offset="1" stop-color="#080d18"/>
    </linearGradient>
    <linearGradient id="gold" x1="92" y1="52" x2="166" y2="204" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f5deb0"/>
      <stop offset=".5" stop-color="#e4c27a"/>
      <stop offset="1" stop-color="#b88b3e"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-30%" width="260%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)" stroke="#e4c27a" stroke-opacity=".16" stroke-width="2"/>
  <g filter="url(#glow)" fill="none" stroke="url(#gold)" stroke-linecap="round">
    <path d="M128 58v140" stroke-width="9"/>
    <path d="M107 77h42" stroke-width="9"/>
  </g>
  <path d="M128 64v128" fill="none" stroke="#fff4d3" stroke-opacity=".24" stroke-width="2" stroke-linecap="round"/>
</svg>
